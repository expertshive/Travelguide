import java.net.Inet4Address
import java.net.NetworkInterface

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Wi-Fi / Ethernet IPv4 of this PC so a physical phone can reach Metro and the
 * API after USB is unplugged. Override with DEV_MACHINE_HOST in local.properties.
 */
def detectDevHost() {
    def lp = rootProject.file("local.properties")
    if (lp.exists()) {
        def props = new Properties()
        lp.withInputStream { props.load(it) }
        def fromFile = (props.getProperty("DEV_MACHINE_HOST") ?: "").trim()
        if (fromFile) {
            return fromFile
        }
    }
    def fromEnv = (System.getenv("DEV_MACHINE_HOST") ?: "").trim()
    if (fromEnv) {
        return fromEnv
    }

    def candidates = []
    NetworkInterface.networkInterfaces.each { ni ->
        try {
            if (!ni.up || ni.loopback) {
                return
            }
        } catch (Exception ignored) {
            return
        }
        def label = "${ni.name} ${ni.displayName}".toLowerCase()
        ni.inetAddresses.each { addr ->
            if (!(addr instanceof Inet4Address) || addr.loopbackAddress) {
                return
            }
            def ip = addr.hostAddress
            if (ip.startsWith("169.254")) {
                return
            }
            def second = ip.tokenize(".")[1]
            def secondOctet = second?.isInteger() ? second.toInteger() : -1
            def privateIp = ip.startsWith("192.168.") || ip.startsWith("10.") ||
                (ip.startsWith("172.") && secondOctet >= 16 && secondOctet <= 31)
            if (!privateIp) {
                return
            }
            def virtual = label.contains("virtual") || label.contains("vmware") ||
                label.contains("vbox") || label.contains("hyper-v") || label.contains("vethernet") ||
                label.contains("docker") || label.contains("wsl") || label.contains("bluetooth")
            def wifi = label.contains("wi-fi") || label.contains("wifi") || label.contains("wlan") ||
                label.contains("wireless")
            def ethernet = label.contains("ethernet") && !virtual
            def rank = virtual ? 50 : (wifi ? 0 : (ethernet ? 1 : 20))
            if (ip.startsWith("192.168.")) {
                rank -= 1
            }
            candidates << [rank: rank, ip: ip]
        }
    }
    if (candidates.isEmpty()) {
        return "127.0.0.1"
    }
    return candidates.sort { it.rank }.first().ip
}

def devMachineHost = detectDevHost()
def generatedHostFile = file("${rootDir}/../src/lib/devMachineHost.ts")
generatedHostFile.parentFile.mkdirs()
generatedHostFile.text = """/** Auto-written at Android build time with your PC's Wi-Fi IP. */
export const DEV_MACHINE_HOST = '${devMachineHost}';
"""
logger.lifecycle("Traveler Guide dev host (phone Wi-Fi): ${devMachineHost}")

